<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>脚本速查手册</title>
  <style>
    /* ========== 主题变量 (暗色) ========== */
    :root {
      color-scheme: dark;
      --background: #1a1b26;
      --foreground: #e8eaf0;
      --card: #222338;
      --border: #363852;
      --muted: #2a2c42;
      --muted-fg: #8b8faa;
      --secondary: #2e3050;
      --primary: #7de0a0;
      --primary-dim: rgba(125, 224, 160, 0.15);
      --input: #252740;
      --code-bg: #1e2035;
      --code-fg: #7de0a0;
      --accent: #7de0a0;
      --radius: 0.5rem;
    }

    /* ========== 重置 ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--background); }
    body { color: var(--foreground); background: var(--background); min-height: 100vh; }
    button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    input { font: inherit; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* ========== 头部 ========== */
    .header {
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(26, 27, 38, 0.92);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 64rem; margin: 0 auto; padding: 0.75rem 1rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    @media (min-width: 640px) {
      .header-inner { flex-direction: row; align-items: center; }
    }
    .brand { display: flex; align-items: center; gap: 0.625rem; flex-shrink: 0; }
    .brand-icon {
      display: flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 0.375rem;
      background: var(--primary-dim); border: 1px solid rgba(125, 224, 160, 0.25);
    }
    .brand-icon svg { width: 1rem; height: 1rem; color: var(--primary); }
    .brand-title { font-size: 0.875rem; font-weight: 700; line-height: 1.2; }
    .brand-sub { font-size: 0.75rem; color: var(--muted-fg); line-height: 1.2; }

    .search-wrap {
      position: relative; flex: 1; width: 100%;
    }
    @media (min-width: 640px) {
      .search-wrap { max-width: 24rem; margin-left: auto; }
    }
    .search-wrap svg {
      position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
      width: 0.875rem; height: 0.875rem; color: var(--muted-fg); pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 0.5rem 0.75rem 0.5rem 2.25rem;
      font-size: 0.875rem; background: var(--input); border: 1px solid var(--border);
      border-radius: 0.375rem; color: var(--foreground); outline: none; transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--muted-fg); }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-dim); }

    /* ========== 主体 ========== */
    .main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem; }
    .search-status {
      margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.875rem; color: var(--muted-fg);
    }
    .search-status .kw { color: var(--primary); font-weight: 500; }
    .search-status .count { color: var(--foreground); font-weight: 500; }
    .btn-clear {
      font-size: 0.75rem; color: var(--muted-fg); padding: 0.125rem 0.5rem;
      border: 1px solid var(--border); border-radius: 0.25rem; transition: color 0.2s;
    }
    .btn-clear:hover { color: var(--foreground); }

    /* 瀑布流 */
    .columns { columns: 1; column-gap: 1rem; }
    @media (min-width: 768px) { .columns { columns: 2; } }
    .col-break { break-inside: avoid; margin-bottom: 1rem; }

    /* 空状态 */
    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 6rem 0; text-align: center;
    }
    .empty svg { width: 2.5rem; height: 2.5rem; color: var(--muted-fg); margin-bottom: 0.75rem; }
    .empty p { font-size: 0.875rem; color: var(--muted-fg); }
    .empty-link { margin-top: 0.75rem; font-size: 0.75rem; color: var(--primary); }
    .empty-link:hover { text-decoration: underline; }

    /* ========== 卡片 ========== */
    .card {
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--card); overflow: hidden;
    }
    .card-header {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1rem; text-align: left; transition: background 0.2s;
    }
    .card-header:hover { background: rgba(46, 48, 80, 0.6); }
    .card-left { display: flex; align-items: center; gap: 0.625rem; }
    .card-icon { font-size: 1rem; }
    .card-title { font-size: 0.875rem; font-weight: 600; }
    .card-count {
      font-size: 0.75rem; color: var(--muted-fg); background: var(--muted);
      border-radius: 9999px; padding: 0.125rem 0.5rem;
    }
    .card-chevron {
      width: 1rem; height: 1rem; color: var(--muted-fg); transition: transform 0.2s; flex-shrink: 0;
    }
    .card-chevron.open { transform: rotate(180deg); }
    .card-body {
      padding: 0.25rem 1rem 1rem; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 0.75rem;
    }

    /* 命令项 */
    .cmd-label { font-size: 0.75rem; font-weight: 500; color: var(--muted-fg); line-height: 1.6; }
    .cmd-note { font-size: 0.75rem; color: rgba(139, 143, 170, 0.7); font-style: italic; margin-left: 0.25rem; }
    .cmd-highlight {
      background: var(--primary-dim); color: var(--primary);
      border-radius: 0.125rem; padding: 0 0.125rem;
    }

    /* 代码块 */
    .code-block {
      display: flex; align-items: flex-start; gap: 0.5rem;
      margin-top: 0.25rem; border-radius: 0.375rem;
      background: var(--code-bg); border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
    }
    .code-text {
      font-size: 0.75rem; color: var(--code-fg); line-height: 1.6;
      word-break: break-all; flex: 1; user-select: all;
    }
    .copy-btn {
      flex-shrink: 0; padding: 0.25rem; border-radius: 0.25rem;
      color: var(--muted-fg); transition: color 0.2s, background 0.2s;
    }
    .copy-btn:hover { color: var(--foreground); background: var(--secondary); }
    .copy-btn.copied { color: var(--primary); }
    .copy-btn svg { width: 0.875rem; height: 0.875rem; }

    /* URL 链接 */
    .url-link {
      display: flex; align-items: center; gap: 0.375rem;
      font-size: 0.75rem; color: var(--accent); word-break: break-all;
      transition: color 0.2s;
    }
    .url-link:hover { color: rgba(125, 224, 160, 0.75); }
    .url-link svg { width: 0.75rem; height: 0.75rem; flex-shrink: 0; }

    /* ========== 页脚 ========== */
    .footer {
      border-top: 1px solid var(--border); margin-top: 2rem;
      padding: 1rem 0; text-align: center;
      font-size: 0.75rem; color: var(--muted-fg);
    }
  </style>
</head>

// ============================================================
//  工具函数
// ============================================================
function isUrl(str) {
  return str.startsWith("http://") || str.startsWith("https://")
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
}

function highlight(text, query) {
  if (!query) return escapeHtml(text)
  const idx = text.toLowerCase().indexOf(query.toLowerCase())
  if (idx === -1) return escapeHtml(text)
  const before = escapeHtml(text.slice(0, idx))
  const match = escapeHtml(text.slice(idx, idx + query.length))
  const after = escapeHtml(text.slice(idx + query.length))
  return `${before}<span class="cmd-highlight">${match}</span>${after}`
}

// ============================================================
//  渲染
// ============================================================
const $app = document.getElementById("app")
const $stats = document.getElementById("stats")
const $search = document.getElementById("search")

// 统计
const totalCommands = COMMANDS.reduce((sum, s) => sum + s.items.length, 0)
$stats.textContent = `${totalCommands} 条命令 · ${COMMANDS.length} 个分类`

// 折叠状态 (false=默认折叠, true=默认展开)
const openState = {}
COMMANDS.forEach(s => { openState[s.id] = false })

function render(query) {
  query = (query || "").trim()
  const q = query.toLowerCase()

  // 过滤
  const visible = query
    ? COMMANDS.filter(s => s.items.some(i =>
        i.label.toLowerCase().includes(q) || i.code.toLowerCase().includes(q)
      ))
    : COMMANDS

  // 匹配数
  const matchCount = query
    ? visible.reduce((sum, s) =>
        sum + s.items.filter(i =>
          i.label.toLowerCase().includes(q) || i.code.toLowerCase().includes(q)
        ).length, 0)
    : totalCommands

  let html = ""

  // 搜索状态
  if (query) {
    html += `<div class="search-status">
      <span>搜索 <span class="kw">"${escapeHtml(query)}"</span> — 找到 <span class="count">${matchCount}</span> 条结果</span>
      <button class="btn-clear" onclick="clearSearch()">清除</button>
    </div>`
  }

  // 空状态
  if (visible.length === 0) {
    html += `<div class="empty">
      ${SVG.terminal}
      <p>没有找到匹配的命令</p>
      <button class="empty-link" onclick="clearSearch()">清除搜索</button>
    </div>`
    $app.innerHTML = html
    return
  }

  // 卡片
  html += `<div class="columns">`
  for (const section of visible) {
    const filteredItems = query
      ? section.items.filter(i =>
          i.label.toLowerCase().includes(q) || i.code.toLowerCase().includes(q))
      : section.items

    if (query && filteredItems.length === 0) continue

    const isOpen = openState[section.id] !== false
    html += `<div class="col-break">
      <div class="card">
        <button class="card-header" onclick="toggle('${section.id}')">
          <div class="card-left">
            <span class="card-icon">${section.icon}</span>
            <span class="card-title">${escapeHtml(section.title)}</span>
            <span class="card-count">${filteredItems.length}</span>
          </div>
          <span id="chevron-${section.id}">${isOpen ? SVG.chevron.replace('class="card-chevron"', 'class="card-chevron open"') : SVG.chevron}</span>
        </button>
        <div class="card-body" id="body-${section.id}" style="${isOpen ? '' : 'display:none'}">`

    for (const item of filteredItems) {
      html += `<div>
        <div style="display:flex;align-items:flex-start;gap:0.375rem;margin-bottom:0.25rem">
          <span class="cmd-label">${highlight(item.label, query)}</span>
          ${item.note ? `<span class="cmd-note">— ${escapeHtml(item.note)}</span>` : ""}
        </div>`

      if (isUrl(item.code)) {
        html += `<a class="url-link" href="${escapeHtml(item.code)}" target="_blank" rel="noopener noreferrer">
          ${SVG.external}
          <span>${escapeHtml(item.code)}</span>
        </a>`
      } else {
        html += `<div class="code-block">
          <code class="code-text">${escapeHtml(item.code)}</code>
          <button class="copy-btn" data-code="${escapeHtml(item.code)}" onclick="copyCmd(this)">${SVG.copy}</button>
        </div>`
      }
      html += `</div>`
    }

    html += `</div></div></div>`
  }
  html += `</div>`

  $app.innerHTML = html
}

// ============================================================
//  交互
// ============================================================
function toggle(id) {
  openState[id] = openState[id] === false ? true : false
  const body = document.getElementById("body-" + id)
  const chevronWrap = document.getElementById("chevron-" + id)
  if (body) body.style.display = openState[id] ? "" : "none"
  if (chevronWrap) {
    const svg = chevronWrap.querySelector(".card-chevron")
    if (svg) svg.classList.toggle("open", openState[id])
  }
}

function copyCmd(btn) {
  const code = btn.dataset.code
  navigator.clipboard.writeText(code).then(() => {
    btn.classList.add("copied")
    btn.innerHTML = SVG.check
    setTimeout(() => {
      btn.classList.remove("copied")
      btn.innerHTML = SVG.copy
    }, 2000)
  })
}

function clearSearch() {
  $search.value = ""
  render("")
}

$search.addEventListener("input", () => render($search.value))

// 初始渲染
render("")
</script>
</body>
</html>
